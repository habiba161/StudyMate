<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - StudyMate</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body class="auth-page">
<div class="top-strip"></div>

<div class="auth-center">
  <div class="auth-card">
    
    <a href="/" class="logo">
      <span class="logo-icon"></span>
      <span>StudyMate</span>
    </a>

    <h1>Create Account</h1>
    <p class="auth-sub">Start your AI-powered learning journey</p>

    <div class="form-group">
      <label class="form-label">Name</label>
      <input id="name" class="input" placeholder="John Doe">
    </div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input id="email" class="input" placeholder="student@university.edu">
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="password" class="input" type="password" placeholder="Create a password">
    </div>

    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input id="confirmPassword" class="input" type="password" placeholder="Confirm your password">
    </div>

    <button id="signupBtn" class="btn btn-primary btn-full">Create Account</button>

    <div class="auth-switch">
      Already have an account? <a href="/login">Login instead</a>
    </div>

  </div>
</div>

<!-- ✅ Script -->
<script type="module">
import { supabase } from "/js/supabase.js";

document.getElementById("signupBtn").addEventListener("click", async () => {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match");
    return;
  }

  const { data, error } = await supabase.auth.signUp({
    email: email,
    password: password,
  });

  if (error) {
    alert(error.message);
  } else {
    alert("Account created successfully!");
    window.location.href = "/login";
  }
});
</script>

</body>
</html>
